<!doctype html><html lang="tr-TR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,follow"><title>Sayfa bulunamadı | Luxora E</title></head><body><main><h1>Sayfa bulunamadı</h1><p>Bu adres mevcut değil. <a href="https://luxora-e.com/">Luxora E ana sayfasına dönün.</a></p></main><script>(function(){var m=location.pathname.match(/^\/(?:profiller|sehirler)\/([a-z0-9-]+)\/?$/i);var p=null;if(m){p=(location.pathname.indexOf('/profiller/')===0?'profil-':'sehir-')+m[1]+'.html'}else if(/^\/rehber\/?$/i.test(location.pathname)){p='rehber.html'}if(p)location.replace('/'+p+location.search+location.hash)})();</script></body></html>
